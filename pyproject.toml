[project]
name = "rypekart"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "andreaszahl" }
]
requires-python = ">=3.12"
dependencies = [
    "geopandas>=1.2.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "owslib>=0.36.0",
    "pandas>=3.1.0",
    "pyogrio>=0.13.0",
    "pyproj>=3.8.0",
    "rasterio>=1.5.2",
    "requests>=2.34.2",
    "scipy>=1.16",
    "shapely>=2.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.scripts]
rypekart = "rypekart:main"

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
